metrics:
  - name: total_sales
    description: Total value of completed sales
    sql: SELECT SUM(amount) FROM sales WHERE status = 'completed'

  - name: sales_by_agent
    description: Total completed sales amount per agent, ordered by highest
    sql: >
      SELECT a.name, SUM(s.amount) AS total
      FROM sales s JOIN agents a ON s.agent_id = a.id
      WHERE s.status = 'completed'
      GROUP BY a.name ORDER BY total DESC

  - name: sales_by_country
    description: Total completed sales grouped by country
    sql: >
      SELECT c.name AS country, SUM(s.amount) AS total
      FROM sales s
      JOIN customers cu ON s.customer_id = cu.id
      JOIN locations l ON cu.location_id = l.id
      JOIN countries c ON l.country_id = c.id
      WHERE s.status = 'completed'
      GROUP BY c.name ORDER BY total DESC

  - name: active_agent_count
    description: Number of currently active agents
    sql: SELECT COUNT(*) FROM agents WHERE status = 'active'

  - name: sales_last_30_days
    description: Total completed sales in the last 30 days
    sql: >
      SELECT SUM(amount) FROM sales
      WHERE status = 'completed'
      AND sale_date >= CURRENT_DATE - INTERVAL '30 days'
